<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum</title>
  <link rel="stylesheet" href="ilmek-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="logo" aria-hidden="true">F</span>
      <h1>Forum</h1>
      <span id="connection" class="chip" role="status" aria-live="polite">…</span>
    </header>

    <section id="list-view" class="stack" aria-labelledby="topics-heading">
      <div class="row spread">
        <h2 id="topics-heading">Konular</h2>
        <button id="toggle-compose" class="btn primary" type="button" aria-expanded="false" aria-controls="new-topic">Yeni konu</button>
      </div>
      <form id="new-topic" class="card pad stack" hidden>
        <label class="field">Başlık <input name="title" maxlength="200" required autocomplete="off"></label>
        <label class="field">İçerik <textarea name="body" maxlength="5000" rows="4" required></textarea></label>
        <div class="row">
          <button class="btn primary" type="submit">Konu aç</button>
          <button id="cancel-compose" class="btn ghost" type="button">Vazgeç</button>
          <span class="meta">Ctrl+Enter ile gönder</span>
        </div>
      </form>
      <div id="topics-card" class="card">
        <ul id="topics" class="list"></ul>
      </div>
    </section>

    <section id="topic-view" class="stack" hidden aria-labelledby="topic-title">
      <div><button id="back" class="btn ghost" type="button">← Konulara dön</button></div>
      <article class="card pad stack">
        <div class="row">
          <span id="topic-avatar"></span>
          <div class="grow">
            <h2 id="topic-title"></h2>
            <p id="topic-author" class="meta"></p>
          </div>
        </div>
        <p id="topic-body" class="prose"></p>
      </article>
      <h3 id="comments-heading"></h3>
      <ul id="comments" class="stack list-plain"></ul>
      <form id="new-comment" class="card pad stack">
        <label class="field">Yorumunuz <textarea name="body" maxlength="5000" rows="3" required></textarea></label>
        <div class="row">
          <button class="btn primary" type="submit">Yorum ekle</button>
          <span class="meta">Ctrl+Enter ile gönder</span>
        </div>
      </form>
    </section>
  </div>
  <script src="ilmek-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
