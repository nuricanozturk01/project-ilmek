<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Forum</h1>
    <span id="connection" role="status" aria-live="polite"></span>
  </header>
  <main>
    <section id="list-view" aria-labelledby="topics-heading">
      <h2 id="topics-heading">Konular</h2>
      <ul id="topics"></ul>
      <p id="topics-empty" hidden>Henüz konu yok.</p>
      <form id="new-topic">
        <h3>Yeni konu</h3>
        <label>Başlık <input name="title" maxlength="200" required></label>
        <label>İçerik <textarea name="body" maxlength="5000" rows="4" required></textarea></label>
        <button type="submit">Konu aç</button>
      </form>
    </section>
    <section id="topic-view" hidden aria-labelledby="topic-title">
      <button id="back" type="button">← Konulara dön</button>
      <h2 id="topic-title"></h2>
      <p id="topic-body"></p>
      <ul id="comments"></ul>
      <form id="new-comment">
        <label>Yorum <textarea name="body" maxlength="5000" rows="3" required></textarea></label>
        <button type="submit">Yorum ekle</button>
      </form>
    </section>
    <p id="notice" role="alert"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
