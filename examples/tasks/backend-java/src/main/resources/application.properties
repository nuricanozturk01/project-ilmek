spring.main.web-application-type=none
# WRITE_DELAY=0 makes each commit durable before it returns. The H2 default delays persistence,
# so a committed write (and its operation record) is lost when the process is killed.
spring.datasource.url=jdbc:h2:file:./data/tasks;WRITE_DELAY=0
spring.jpa.hibernate.ddl-auto=update
