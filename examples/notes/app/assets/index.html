<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notlar</title>
  <link rel="stylesheet" href="ilmek-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell shell-wide">
    <header class="topbar">
      <span class="logo" aria-hidden="true">N</span>
      <h1>Notlar</h1>
      <span id="connection" class="chip" role="status" aria-live="polite">…</span>
    </header>
    <div class="split">
      <aside class="card" aria-label="Not listesi">
        <div class="pad stack">
          <button id="new" class="btn primary" type="button">Yeni not</button>
          <input id="filter" class="search" type="search" placeholder="Notlarda ara" aria-label="Notlarda ara" autocomplete="off">
        </div>
        <ul id="notes" class="list"></ul>
      </aside>
      <main>
        <form id="editor" class="card pad stack" hidden>
          <label class="field">Başlık <input name="title" maxlength="200" required autocomplete="off"></label>
          <label class="field">İçerik <textarea name="body" rows="14" maxlength="20000"></textarea></label>
          <div class="row spread">
            <span id="draft-state" class="meta" role="status"></span>
            <span class="row">
              <button id="delete" class="btn danger" type="button">Sil</button>
              <button class="btn primary" type="submit">Kaydet</button>
            </span>
          </div>
        </form>
        <div id="placeholder" class="card"></div>
      </main>
    </div>
  </div>
  <script src="ilmek-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
