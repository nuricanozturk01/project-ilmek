# Install as /usr/lib/tmpfiles.d/ilmek.conf; then: systemd-tmpfiles --create
d /etc/ilmek          0755 root  root  -
d /etc/ilmek/secrets  0700 root  root  -
d /var/lib/ilmek      0755 root  root  -
d /var/lib/ilmek/registry     0700 ilmek ilmek -
d /var/lib/ilmek/host         0700 ilmek ilmek -
d /var/lib/ilmek/host-device  0700 ilmek ilmek -
